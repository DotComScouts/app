name: Bluesky Beta regression tests

on:
  push:
    branches:
      - 'beta-*'
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/bluesky-beta-tests.yml'
  pull_request:
    branches:
      - 'beta-*'
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/bluesky-beta-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bluesky-beta-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic regression suite
        run: node --test tests/bluesky-beta.test.js tests/multi-source-evidence.test.js tests/normal-flow-shadow-integration.test.js tests/shadow-normalization.test.js

  bluesky-live-api-smoke:
    # This is diagnostic only: a transient public API outage must not mask unit-test results.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query public Bluesky API
        run: node --test tests/bluesky-live-smoke.test.js

  source-api-baseline-smoke:
    # Diagnostic only: external service outages/rate limits must not mask deterministic regression results.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query existing trend-source APIs
        run: node --test tests/source-api-smoke.test.js

  bluesky-browser-smoke:
    # Diagnostic only: checks the deployed GitHub Pages UI and CORS path without blocking deterministic tests.
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      DOTCOMSCOUTS_TEST_URL: https://dotcomscouts.github.io/app/
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.0
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test deployed panels and normal-flow shadow integration in Chromium
        run: node tests/bluesky-browser-smoke.cjs
